spring.application.name=obymedic

# BASE DE DATOS (local: MySQL | produccion: variables de entorno en Render)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/obymedic?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.MySQLDialect}

# PUERTO
server.port=${PORT:8080}

# ARCHIVOS
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB


# AUTH
doctor.username=${DOCTOR_USERNAME:doctor}
doctor.password=${DOCTOR_PASSWORD:Obym@2024}
admin.username=${ADMIN_USERNAME:antonio21}
admin.password=${ADMIN_PASSWORD:r8i5l3u5}

# RENIEC / apiperu.dev (token en secrets.properties — no subir a git)
apiperu.token=${APIPERU_TOKEN:}
spring.config.import=optional:file:./secrets.properties

# CORREO (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:backgroundregistro@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
backup.email.destino=${BACKUP_EMAIL:backgroundregistro@gmail.com}
