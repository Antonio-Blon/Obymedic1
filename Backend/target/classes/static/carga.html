<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <title>OBYMEDIC — Cargando</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="assets/css/loading.css" />
</head>
<body>

  <div class="bg-layer"></div>
  <div id="particles"></div>

  <div class="hex" style="top:10%;left:8%;animation-duration:14s">
    <svg viewBox="0 0 100 100"><polygon points="50,2 93,25 93,75 50,98 7,75 7,25" fill="none" stroke="#c6b5a7" stroke-width="2"/></svg>
  </div>
  <div class="hex" style="top:60%;right:10%;animation-duration:18s;width:120px;height:120px">
    <svg viewBox="0 0 100 100"><polygon points="50,2 93,25 93,75 50,98 7,75 7,25" fill="none" stroke="#b8a696" stroke-width="2"/></svg>
  </div>
  <div class="hex" style="bottom:15%;left:20%;animation-duration:22s;width:60px;height:60px">
    <svg viewBox="0 0 100 100"><polygon points="50,2 93,25 93,75 50,98 7,75 7,25" fill="none" stroke="#8a6d5a" stroke-width="2"/></svg>
  </div>

  <div class="splash">
    <div class="icon-wrap">
      <i class="fa-solid fa-heart-pulse"></i>
    </div>

    <div>
      <div class="brand-name">OBY<span>MEDIC</span></div>
    </div>
    <div class="brand-sub">Sistema de Gestión de Consultas Obstétricas</div>

    <div class="progress-track">
      <div class="progress-fill"></div>
    </div>

    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>

    <div class="status-text">Iniciando sistema médico…</div>
  </div>

  <script>
    const container = document.getElementById('particles');
    for (let i = 0; i < 20; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = Math.random() * 40 + 10;
      p.style.cssText = `
        width:${size}px; height:${size}px;
        left:${Math.random() * 100}%;
        bottom:-${size}px;
        background: ${['#c6b5a7','#b8a696','#8a6d5a'][Math.floor(Math.random() * 3)]};
        animation-duration: ${Math.random() * 10 + 8}s;
        animation-delay: ${Math.random() * 5}s;
      `;
      container.appendChild(p);
    }

    setTimeout(() => { window.location.href = 'login.html'; }, 2500);
  </script>
</body>
</html>
